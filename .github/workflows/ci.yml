name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $header = Select-String -Path src\version.h -Pattern '#define CCPL_VERSION "([^"]+)"'
          if (-not $header -or $header.Matches[0].Groups[1].Value -ne $version) {
            throw "VERSION ($version) and src/version.h do not match"
          }

      - name: Install TinyCC
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip" -OutFile tcc.zip
          Expand-Archive tcc.zip -DestinationPath tcc
          $exe = Get-ChildItem -Recurse -Filter tcc.exe tcc | Select-Object -First 1
          if (-not $exe) { throw "tcc.exe not found in archive" }
          "TCC=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build compiler and clm
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & $env:TCC src\compiler.c -o build\coolc.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:TCC src\clm.c -o build\clm.exe "$env:WINDIR\System32\ws2_32.dll" "$env:WINDIR\System32\shell32.dll"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item -Recurse (Split-Path $env:TCC) build\tcc
          Copy-Item src\runtime.h build\runtime.h

      - name: Locate Python for the FFI example
        shell: pwsh
        run: |
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($py) {
            $dir = Split-Path $py
            $dll = Get-ChildItem $dir -Filter "python3*.dll" |
              Where-Object { $_.Name -match '^python3\d+\.dll$' } |
              Select-Object -First 1
            if ($dll) { "CCPL_PYTHON_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append }
          }

      - name: Run examples
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem examples\*.ccpl | ForEach-Object {
            if ($_.Name -eq "ffi_python.ccpl" -and -not $env:CCPL_PYTHON_DLL) {
              Write-Host "== $($_.Name) skipped, no Python DLL found =="
              return
            }
            Write-Host "== $($_.Name) =="
            & build\coolc.exe $_.FullName -o (Join-Path $env:TEMP ($_.BaseName + ".exe")) --run
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { throw "$failed example(s) failed" }

      - name: Run regression tests
        shell: pwsh
        run: |
          ./tests/run.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }